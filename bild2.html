<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rot: #D0111B;
    --schwarz: #0B0B0B;
    --warm: #F4F1EA;
    --grau: #9A9A9A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--schwarz); color: var(--warm); font-family: 'IBM Plex Sans', sans-serif; }
  .poster { position: relative; width: 1080px; height: 1350px; }

  .kopf { position: absolute; left: 72px; right: 72px; top: 80px; }
  .liga { font-weight: 600; font-size: 40px; color: var(--grau); }
  .zeit {
    margin-top: 60px;
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 900;
    font-size: 380px; line-height: .8; letter-spacing: -6px;
    color: var(--rot); white-space: nowrap;
  }
  .tag { margin-top: 36px; font-weight: 600; font-size: 52px; line-height: 1.15; }

  .ort {
    position: absolute; left: 72px; right: 72px; top: 720px;
    border-top: 3px solid var(--rot); padding-top: 48px;
  }
  .ort h2 {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 100px; line-height: .92; text-transform: uppercase;
  }
  .ort p { margin-top: 18px; font-size: 44px; line-height: 1.25; color: var(--grau); }

  .unten {
    position: absolute; left: 72px; right: 72px; bottom: 80px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 40px;
  }
  .aufruf { font-weight: 600; font-size: 44px; line-height: 1.25; max-width: 620px; }
  .wappen {
    width: 210px; height: 210px; border-radius: 50%; flex: none;
    background: var(--warm); padding: 34px; overflow: hidden;
    display: grid; place-items: center;
  }
  .wappen img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .wappen span {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 900;
    font-size: 88px; line-height: 1; color: var(--schwarz);
  }
</style>
</head>
<body>
  <main class="poster">
    <header class="kopf">
      <p class="liga">{{ liga }}</p>
      <p class="zeit">{{ uhrzeit }}</p>
      <p class="tag">Anstoß am {{ wochentag }}, {{ datum_lang }}</p>
    </header>

    <section class="ort">
      <h2>{{ ort }}</h2>
      <p>{{ adresse }}</p>
    </section>

    <footer class="unten">
      <p class="aufruf">{% if heim %}Kommt vorbei und feuert uns an.{% else %}Wir reisen an. Drückt uns die Daumen!{% endif %}</p>
      <div class="wappen">
        {% if verein_logo %}<img src="{{ verein_logo }}" alt="">{% else %}<span>{{ verein_kuerzel }}</span>{% endif %}
      </div>
    </footer>
  </main>
</body>
</html>
