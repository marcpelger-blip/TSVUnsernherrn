<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rot: #D0111B;
    --schwarz: #0B0B0B;
    --warm: #F4F1EA;
    --grau: #9A9A9A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--schwarz); color: var(--warm); font-family: 'IBM Plex Sans', sans-serif; }
  .poster { position: relative; width: 1080px; height: 1350px; }

  .kopf { position: absolute; left: 72px; right: 72px; top: 80px; }
  .kopf h1 {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 900;
    font-size: 196px; line-height: .8; text-transform: uppercase; white-space: nowrap;
  }
  .liga { margin-top: 30px; font-weight: 600; font-size: 40px; color: var(--grau); }

  .duell {
    position: absolute; left: 72px; right: 72px; top: 352px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
  }
  .seite { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .wappen {
    width: 300px; height: 300px; border-radius: 50%;
    background: var(--warm); padding: 44px; overflow: hidden;
    display: grid; place-items: center;
  }
  .wappen img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .wappen span {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 900;
    font-size: 120px; line-height: 1; color: var(--schwarz);
  }
  .seite h2 {
    margin-top: 36px; max-width: 440px;
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 78px; line-height: .92; text-transform: uppercase;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 480px;
    background: var(--rot);
    clip-path: polygon(0 16%, 100% 0, 100% 100%, 0 100%);
  }
  .termin { position: absolute; left: 72px; right: 72px; bottom: 76px; }
  .art, .wann { font-weight: 600; font-size: 44px; line-height: 1.15; }
  .uhr {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 900;
    font-size: 190px; line-height: .85; letter-spacing: -2px; white-space: nowrap;
  }
  .uhr small { font-size: 88px; letter-spacing: 0; margin-left: 16px; }
</style>
</head>
<body>
  <main class="poster">
    <header class="kopf">
      <h1>Spieltag</h1>
      <p class="liga">{{ liga }}</p>
    </header>

    <section class="duell">
      <div class="seite">
        <div class="wappen">
          {% if heim_logo %}<img src="{{ heim_logo }}" alt="">{% else %}<span>{{ heim_kuerzel }}</span>{% endif %}
        </div>
        <h2>{{ heim_name }}</h2>
      </div>
      <div class="seite">
        <div class="wappen">
          {% if gast_logo %}<img src="{{ gast_logo }}" alt="">{% else %}<span>{{ gast_kuerzel }}</span>{% endif %}
        </div>
        <h2>{{ gast_name }}</h2>
      </div>
    </section>

    <footer class="band">
      <div class="termin">
        <p class="art">{{ spielart }}</p>
        <p class="wann">{{ wochentag }}, {{ datum_kurz }}</p>
        <p class="uhr">{{ uhrzeit }}<small>Uhr</small></p>
      </div>
    </footer>
  </main>
</body>
</html>
